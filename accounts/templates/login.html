{% extends "base.html" %}
{% load static %}
{% block extra_styles %}
    <link rel="stylesheet" href="{% static "login/login.css" %}">
{% endblock %}
{% block content %}
<div class="container">    
    <h2>Login</h2>
    <p>Digite os seus dados de acesso nos campos abaixo.</p>
    <form method="POST">
        {% csrf_token %}
            <label>Nome:</label>
            <input type="text" name="nome" required>
            <label>Senha:</label>
            <input type="password" name="senha" required>
            <p>
                Ainda não tem conta?
                <a href="{% url "cadastro" %}">Registre-se</a>
            </p>
            <button type="submit" class="btn">Acessar</button>
    </form>
</div>
{% endblock %}
